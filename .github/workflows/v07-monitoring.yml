name: v0.7 monitoring verification

on:
  push:
    branches: [manus]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitoring:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinIO client
        run: |
          MC_URL="$(curl --fail --silent --show-error \
            https://api.github.com/repos/minio/mc/releases/latest \
            | jq -r '.assets[] | select(.name | test("mc\\.linux-amd64\\.RELEASE[^.]*.*$")) | .browser_download_url' \
            | head -n 1)"
          test -n "$MC_URL"
          curl --fail --silent --show-error --location "$MC_URL" --output /tmp/mc
          chmod +x /tmp/mc
          sudo mv /tmp/mc /usr/local/bin/mc

      - name: Prepare test environment
        run: |
          cat > .env <<'EOF'
          MINIO_ROOT_USER=minvault-admin
          MINIO_ROOT_PASSWORD=minvault-root-password-123
          MINIO_PROMETHEUS_AUTH_TYPE=public
          BACKUP_MINIO_ROOT_USER=backup-admin
          BACKUP_MINIO_ROOT_PASSWORD=backup-root-password-123
          RESTIC_PASSWORD=restic-password-123
          BACKUP_AGENT_SECRET=backup-agent-password-123
          APP_DOCS_SECRET=app-docs-password-123
          APP_MEDIA_SECRET=app-media-password-123
          APP_LOGS_SECRET=app-logs-password-123
          AUDITOR_SECRET=auditor-password-123
          GRAFANA_ADMIN_USER=admin
          GRAFANA_ADMIN_PASSWORD=grafana-password-123
          NGINX_HTTP_PORT=8080
          NGINX_HTTPS_PORT=8443
          PROMETHEUS_PORT=9090
          GRAFANA_PORT=3000
          EOF
          printf '127.0.0.1 s3.localhost console.localhost\n' | sudo tee -a /etc/hosts
          ./scripts/gen-certs.sh

      - name: Start storage gateway
        run: docker compose up -d minio1 minio2 minio3 minio4 minio-backup nginx

      - name: Wait for storage gateway
        run: |
          for attempt in {1..60}; do
            if curl --insecure --silent --fail https://s3.localhost:8443/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=100 nginx minio1 minio2 minio3 minio4 minio-backup
          exit 1

      - name: Provision storage
        env:
          MINIO_ENDPOINT: https://s3.localhost:8443
          MC_INSECURE: '1'
        run: |
          set -a
          . ./.env
          set +a
          ./minio/init.sh

      - name: Start monitoring stack
        run: |
          docker compose build backup backup-exporter
          docker compose up -d backup backup-exporter prometheus grafana
          docker compose run --rm backup /usr/local/bin/backup.sh

      - name: Verify Prometheus, exporter and Grafana
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:9090/-/ready >/dev/null \
              && curl --fail --silent http://localhost:3000/api/health >/dev/null; then
              break
            fi
            sleep 5
          done
          test "$(curl --fail --silent http://localhost:9090/-/ready)" = "Prometheus Server is Ready."
          curl --fail --silent http://localhost:3000/api/health | jq -e '.database == "ok"'
          curl --fail --silent http://localhost:9101/metrics >/dev/null || true

      - name: Verify MinIO targets and backup metrics
        run: |
          for attempt in {1..20}; do
            MINIO_UP="$(curl --fail --silent --get http://localhost:9090/api/v1/query \
              --data-urlencode 'query=sum(up{job="minio"})' | jq -r '.data.result[0].value[1] // "0"')"
            BACKUP_OK="$(curl --fail --silent --get http://localhost:9090/api/v1/query \
              --data-urlencode 'query=minvault_backup_success' | jq -r '.data.result[0].value[1] // "0"')"
            if [ "$MINIO_UP" = "4" ] && [ "$BACKUP_OK" = "1" ]; then
              break
            fi
            sleep 5
          done
          test "$MINIO_UP" = "4"
          test "$BACKUP_OK" = "1"
          curl --fail --silent http://localhost:9090/api/v1/rules?type=alert | jq -e '.data.groups[].rules[] | select(.name == "MinIOInstanceDown")'
          curl --fail --silent http://localhost:9090/api/v1/rules?type=alert | jq -e '.data.groups[].rules[] | select(.name == "MinIOBackupStale")'

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Cleanup
        if: always()
        run: docker compose down -v
