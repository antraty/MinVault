name: v0.6 restore verification

on:
  push:
    branches: [manus]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinIO client
        run: |
          MC_URL="$(curl --fail --silent --show-error \
            https://api.github.com/repos/minio/mc/releases/latest \
            | jq -r '.assets[] | select(.name | test("mc\\.linux-amd64\\.RELEASE[^.]*.*$")) | .browser_download_url' \
            | head -n 1)"
          test -n "$MC_URL"
          curl --fail --silent --show-error --location "$MC_URL" --output /tmp/mc
          chmod +x /tmp/mc
          sudo mv /tmp/mc /usr/local/bin/mc

      - name: Prepare test environment
        run: |
          cat > .env <<'EOF'
          MINIO_ROOT_USER=minvault-admin
          MINIO_ROOT_PASSWORD=minvault-root-password-123
          BACKUP_MINIO_ROOT_USER=backup-admin
          BACKUP_MINIO_ROOT_PASSWORD=backup-root-password-123
          RESTIC_PASSWORD=restic-password-123
          BACKUP_AGENT_SECRET=backup-agent-password-123
          APP_DOCS_SECRET=app-docs-password-123
          APP_MEDIA_SECRET=app-media-password-123
          APP_LOGS_SECRET=app-logs-password-123
          AUDITOR_SECRET=auditor-password-123
          NGINX_HTTP_PORT=8080
          NGINX_HTTPS_PORT=8443
          EOF
          printf '127.0.0.1 s3.localhost console.localhost\n' | sudo tee -a /etc/hosts
          ./scripts/gen-certs.sh

      - name: Start MinVault
        run: docker compose up -d minio1 minio2 minio3 minio4 minio-backup nginx

      - name: Wait for HTTPS gateway
        run: |
          for attempt in {1..60}; do
            if curl --insecure --silent --fail https://s3.localhost:8443/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=100 nginx minio1 minio2 minio3 minio4 minio-backup
          exit 1

      - name: Provision buckets and users
        env:
          MINIO_ENDPOINT: https://s3.localhost:8443
          MC_INSECURE: '1'
        run: |
          set -a
          . ./.env
          set +a
          ./minio/init.sh

      - name: Build backup image
        run: docker compose build backup

      - name: Run v0.6 restore test
        run: |
          docker compose run --rm backup /usr/local/bin/restore-test.sh | tee restore-test.log
          grep -qx 'RESULT: PASS' <(tail -n 1 restore-test.log)
          docker compose run --rm backup restic check

      - name: Verify persisted result
        run: |
          docker compose run --rm backup cat /status/restore-test.status
          docker compose run --rm backup sh -c 'grep -q "result=PASS" /status/restore-test.status'

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Cleanup
        if: always()
        run: docker compose down -v
