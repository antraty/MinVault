x-minio-common: &minio-common
  # Les images communautaires minio/minio ne sont plus publiées sur Docker Hub/Quay.
  # Chainguard fournit une image publique maintenue et compatible MinIO.
  image: cgr.dev/chainguard/minio:latest
  restart: unless-stopped
  env_file:
    - .env
  environment:
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER doit être défini dans .env}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD doit être défini dans .env}
  command: server http://minio{1...4}/data --console-address ":9001"
  networks:
    - minvault
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 20s
  security_opt:
    - no-new-privileges:true

services:
  minio1:
    <<: *minio-common
    container_name: minvault-minio1
    hostname: minio1
    volumes:
      - minio1_data:/data

  minio2:
    <<: *minio-common
    container_name: minvault-minio2
    hostname: minio2
    volumes:
      - minio2_data:/data

  minio3:
    <<: *minio-common
    container_name: minvault-minio3
    hostname: minio3
    volumes:
      - minio3_data:/data

  minio4:
    <<: *minio-common
    container_name: minvault-minio4
    hostname: minio4
    volumes:
      - minio4_data:/data

  nginx:
    image: nginx:1.27.3-alpine
    container_name: minvault-nginx
    restart: unless-stopped
    depends_on:
      minio1:
        condition: service_healthy
      minio2:
        condition: service_healthy
      minio3:
        condition: service_healthy
      minio4:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - minvault
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate --spider -q https://localhost/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true

networks:
  minvault:
    name: minvault_network
    driver: bridge

volumes:
  minio1_data:
    name: minvault_minio1_data
  minio2_data:
    name: minvault_minio2_data
  minio3_data:
    name: minvault_minio3_data
  minio4_data:
    name: minvault_minio4_data
