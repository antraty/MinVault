x-minio-common: &minio-common
  # Les images communautaires minio/minio ne sont plus publiées sur Docker Hub/Quay.
  # Chainguard fournit une image publique maintenue et compatible MinIO.
  image: cgr.dev/chainguard/minio:latest
  restart: unless-stopped
  env_file:
    - .env
  environment:
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER doit être défini dans .env}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD doit être défini dans .env}
    MINIO_PROMETHEUS_AUTH_TYPE: ${MINIO_PROMETHEUS_AUTH_TYPE:-public}
  command: server http://minio{1...4}/data --console-address ":9001"
  networks:
    - minvault
  healthcheck:
    # L’image Chainguard ne fournit pas nécessairement curl/wget ; vérifier
    # ici que le processus MinIO reste vivant. Le workflow vérifie ensuite
    # explicitement /minio/health/live via Nginx avant le provisioning.
    test: ["CMD-SHELL", "kill -0 1"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 20s
  security_opt:
    - no-new-privileges:true

services:
  minio1:
    <<: *minio-common
    container_name: minvault-minio1
    hostname: minio1
    volumes:
      - minio1_data:/data

  minio2:
    <<: *minio-common
    container_name: minvault-minio2
    hostname: minio2
    volumes:
      - minio2_data:/data

  minio3:
    <<: *minio-common
    container_name: minvault-minio3
    hostname: minio3
    volumes:
      - minio3_data:/data

  minio4:
    <<: *minio-common
    container_name: minvault-minio4
    hostname: minio4
    volumes:
      - minio4_data:/data

  minio-backup:
    image: cgr.dev/chainguard/minio:latest
    container_name: minvault-minio-backup
    hostname: minio-backup
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${BACKUP_MINIO_ROOT_USER:?BACKUP_MINIO_ROOT_USER doit être défini dans .env}
      MINIO_ROOT_PASSWORD: ${BACKUP_MINIO_ROOT_PASSWORD:?BACKUP_MINIO_ROOT_PASSWORD doit être défini dans .env}
    command: server /data --console-address ":9001"
    volumes:
      - minio_backup_data:/data
    networks:
      - minvault
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.27.3-alpine
    container_name: minvault-nginx
    restart: unless-stopped
    depends_on:
      minio1:
        condition: service_healthy
      minio2:
        condition: service_healthy
      minio3:
        condition: service_healthy
      minio4:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - minvault
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate --spider -q https://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  backup:
    build:
      context: ./backup
    image: minvault-backup:0.6
    container_name: minvault-backup
    restart: unless-stopped
    depends_on:
      minio1:
        condition: service_healthy
      minio-backup:
        condition: service_healthy
    env_file:
      - .env
    environment:
      BACKUP_AGENT_SECRET: ${BACKUP_AGENT_SECRET:?BACKUP_AGENT_SECRET doit être défini dans .env}
      RCLONE_CONFIG_VAULT_TYPE: s3
      RCLONE_CONFIG_VAULT_PROVIDER: Minio
      RCLONE_CONFIG_VAULT_ENV_AUTH: "false"
      RCLONE_CONFIG_VAULT_ACCESS_KEY_ID: backup-agent
      RCLONE_CONFIG_VAULT_SECRET_ACCESS_KEY: ${BACKUP_AGENT_SECRET:?BACKUP_AGENT_SECRET doit être défini dans .env}
      RCLONE_CONFIG_VAULT_ENDPOINT: http://minio1:9000
      RCLONE_CONFIG_VAULT_REGION: us-east-1
      RESTIC_REPOSITORY: s3:http://minio-backup:9000/restic-repo
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?RESTIC_PASSWORD est requis dans .env}
      AWS_S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${BACKUP_MINIO_ROOT_USER:?BACKUP_MINIO_ROOT_USER doit être défini dans .env}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_MINIO_ROOT_PASSWORD:?BACKUP_MINIO_ROOT_PASSWORD doit être défini dans .env}
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
      RESTIC_KEEP_DAILY: ${RESTIC_KEEP_DAILY:-7}
      RESTIC_KEEP_WEEKLY: ${RESTIC_KEEP_WEEKLY:-4}
      RESTIC_KEEP_MONTHLY: ${RESTIC_KEEP_MONTHLY:-6}
    volumes:
      - backup_staging:/staging
      - backup_status:/status
      - backup_logs:/var/log/minvault
      - backup_lock:/run/minvault
    networks:
      - minvault
    security_opt:
      - no-new-privileges:true

  backup-exporter:
    build:
      context: ./monitoring/backup-exporter
    image: minvault-backup-exporter:0.7
    container_name: minvault-backup-exporter
    restart: unless-stopped
    depends_on:
      backup:
        condition: service_started
    volumes:
      - backup_status:/status:ro
    networks:
      - minvault
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: minvault-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - minvault
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:11.5.2
    container_name: minvault-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD doit être défini dans .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: ${GRAFANA_SERVER_DOMAIN:-localhost}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - minvault
    security_opt:
      - no-new-privileges:true

networks:
  minvault:
    name: minvault_network
    driver: bridge

volumes:
  minio1_data:
    name: minvault_minio1_data
  minio2_data:
    name: minvault_minio2_data
  minio3_data:
    name: minvault_minio3_data
  minio4_data:
    name: minvault_minio4_data
  minio_backup_data:
    name: minvault_minio_backup_data
  backup_staging:
    name: minvault_backup_staging
  backup_status:
    name: minvault_backup_status
  backup_logs:
    name: minvault_backup_logs
  backup_lock:
    name: minvault_backup_lock
  prometheus_data:
    name: minvault_prometheus_data
  grafana_data:
    name: minvault_grafana_data
