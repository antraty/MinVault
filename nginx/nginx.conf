events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    log_format minvault_upstream '$remote_addr "$request" status=$status upstream=$upstream_addr upstream_status=$upstream_status';
    access_log /dev/stdout minvault_upstream;

    # Les uploads S3 peuvent être volumineux ; la limite reste volontairement finie.
    client_max_body_size 5g;
    client_body_timeout 300s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_buffering off;

    limit_req_zone $binary_remote_addr zone=s3_api:10m rate=20r/s;

    upstream minio_api {
        zone minio_api 64k;
        least_conn;
        server minio1:9000 resolve max_fails=3 fail_timeout=10s;
        server minio2:9000 resolve max_fails=3 fail_timeout=10s;
        server minio3:9000 resolve max_fails=3 fail_timeout=10s;
        server minio4:9000 resolve max_fails=3 fail_timeout=10s;
    }

    upstream minio_console {
        zone minio_console 64k;
        least_conn;
        server minio1:9001 resolve max_fails=3 fail_timeout=10s;
        server minio2:9001 resolve max_fails=3 fail_timeout=10s;
        server minio3:9001 resolve max_fails=3 fail_timeout=10s;
        server minio4:9001 resolve max_fails=3 fail_timeout=10s;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name s3.localhost console.localhost;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name s3.localhost;

        ssl_certificate /etc/nginx/certs/minvault.crt;
        ssl_certificate_key /etc/nginx/certs/minvault.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /healthz {
            access_log off;
            return 200 'ok\n';
            add_header Content-Type text/plain;
        }

        location / {
            limit_req zone=s3_api burst=40 nodelay;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass http://minio_api;
        }
    }

    server {
        listen 443 ssl;
        server_name console.localhost;

        ssl_certificate /etc/nginx/certs/minvault.crt;
        ssl_certificate_key /etc/nginx/certs/minvault.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /healthz {
            access_log off;
            return 200 'ok\n';
            add_header Content-Type text/plain;
        }

        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass http://minio_console;
        }
    }
}
